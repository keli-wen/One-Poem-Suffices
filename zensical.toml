[project]
site_name = "One Poem Suffices"
site_url = "https://keli-wen.github.io/One-Poem-Suffices/"
site_description = "Deep dives into Agent Engineering, Context Engineering, AI Coding, and beyond."
site_author = "Keli Wen"

repo_name = "keli-wen/One-Poem-Suffices"
repo_url = "https://github.com/keli-wen/One-Poem-Suffices"

copyright = "Copyright &copy; 2025 Keli Wen"

nav = [
    { "首页" = "index.md" },
    { "One Poem Suffices" = [
        { "index" = "one-poem-suffices/index.md" },
        { "Prompt Caching" = "one-poem-suffices/prompt-caching/index.md" },
        { "Model Context Protocol" = "one-poem-suffices/model-context-protocol/index.md" },
        { "Multi-Agent System" = "one-poem-suffices/multi-agent-system/index.md" },
        { "Context Engineering" = "one-poem-suffices/context-engineering/index.md" },
        { "Just-in-Time Context" = "one-poem-suffices/just-in-time-context/index.md" },
    ]},
    { "Thinking in Context" = [
        { "index" = "thinking-in-context/index.md" },
        { "Codex 中的上下文工程" = "thinking-in-context/context-engineering-from-codex/index.md" },
    ]},
    { "Zen of AI Coding" = [
        { "index" = "zen-of-ai-coding/index.md" },
        { "引子与问题划分" = "zen-of-ai-coding/intro/index.md" },
        { "最佳实践 I" = "zen-of-ai-coding/best-practice-1/index.md" },
    ]},
    { "Scaling 一下" = [
        { "index" = "scaling-thoughts/index.md" },
        { "出租时间与为自己工作" = "scaling-thoughts/renting-time/index.md" },
        { "当写代码成为基本能力" = "scaling-thoughts/coding-as-basic-skill/index.md" },
        { "GenAI 时代的全栈开发" = "scaling-thoughts/genai-fullstack/index.md" },
        { "把 LLM 当作你的私人秘书" = "scaling-thoughts/llm-as-secretary/index.md" },
        { "月供 $125" = "scaling-thoughts/monthly-125-scaling/index.md" },
        { "Seedance 2.0 的核扩散" = "scaling-thoughts/seedance-nuclear/index.md" },
        { "2025 总结" = "scaling-thoughts/2025-review/index.md" },
        { "当 Token 成为新的生产资料" = "scaling-thoughts/token-as-resource/index.md" },
    ]},
]

[project.theme]
language = "zh"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.top",
    "navigation.footer",
    "navigation.indexes",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Noto Sans SC"
code = "JetBrains Mono"

[project.extra]
alternate = [
    { name = "中文", link = "/One-Poem-Suffices/", lang = "zh" },
    { name = "English", link = "/One-Poem-Suffices/en/", lang = "en" },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/keli-wen"
