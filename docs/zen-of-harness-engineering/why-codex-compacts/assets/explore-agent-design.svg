<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Claude Code Explore 子 agent 的特化设计：只读 prompt、工具白名单、默认 haiku、omitClaudeMd，探索的中间输出留在子 agent context，只回结论摘要</title>
  <style>
    .zh  { font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .mono{ font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  </style>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#2B2722" opacity="0.045"/>
    </pattern>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B655C"/>
    </marker>
    <marker id="ah-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="940" height="470" fill="#FFFFFF"/>
  <rect width="940" height="470" fill="url(#dots)"/>

  <!-- ─── 主 agent ─── -->
  <rect x="52" y="150" width="176" height="190" rx="14" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="68" y="183" font-size="15" font-weight="600" fill="#2B2722">主 agent</text>
  <text class="mono" x="68" y="201" font-size="10.5" fill="#9B948A">main context</text>
  <line x1="68" y1="212" x2="212" y2="212" stroke="#EAE5DE" stroke-width="1"/>
  <line x1="68" y1="236" x2="192" y2="236" stroke="#D9D4CC" stroke-width="5" stroke-linecap="round"/>
  <line x1="68" y1="258" x2="164" y2="258" stroke="#D9D4CC" stroke-width="5" stroke-linecap="round"/>
  <line x1="68" y1="280" x2="204" y2="280" stroke="#D9D4CC" stroke-width="5" stroke-linecap="round"/>
  <line x1="68" y1="302" x2="132" y2="302" stroke="#D97757" stroke-width="5" stroke-linecap="round"/>
  <text class="zh" x="68" y="327" font-size="11" fill="#9B948A">全程平走</text>

  <!-- ─── 派发箭头 ─── -->
  <path d="M 236 200 C 320 200, 380 158, 460 152" fill="none" stroke="#6B655C" stroke-width="1.4" marker-end="url(#ah-ink)"/>
  <text class="mono" x="348" y="136" font-size="12" fill="#2B2722" text-anchor="middle">Agent( Explore )</text>
  <text class="zh" x="348" y="153" font-size="10.5" fill="#9B948A" text-anchor="middle">工具描述写明 whenToUse</text>

  <!-- ─── 回收箭头 ─── -->
  <path d="M 462 330 C 380 330, 322 304, 242 298" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#ah-coral)"/>
  <text class="zh" x="350" y="356" font-size="12" fill="#2B2722" text-anchor="middle">只回结论与摘要</text>
  <text class="zh" x="350" y="372" font-size="10.5" fill="#9B948A" text-anchor="middle">几百字</text>

  <!-- ─── Explore 子 agent ─── -->
  <rect x="470" y="96" width="360" height="286" rx="16" fill="#FFFDFB" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="490" y="130" font-size="15" font-weight="600" fill="#2B2722">Explore 子 agent</text>
  <text class="mono" x="810" y="130" font-size="10.5" fill="#D97757" text-anchor="end">read-only</text>
  <line x1="490" y1="144" x2="810" y2="144" stroke="#EFE9E1" stroke-width="1"/>

  <!-- 中间输出（草稿） -->
  <line x1="490" y1="168" x2="790" y2="168" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <line x1="490" y1="190" x2="754" y2="190" stroke="#D8D2C9" stroke-width="7" stroke-linecap="round"/>
  <line x1="490" y1="212" x2="776" y2="212" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <line x1="490" y1="234" x2="720" y2="234" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <line x1="490" y1="256" x2="786" y2="256" stroke="#D8D2C9" stroke-width="7" stroke-linecap="round"/>
  <line x1="490" y1="278" x2="698" y2="278" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <line x1="490" y1="300" x2="760" y2="300" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <text class="zh" x="490" y="344" font-size="11" fill="#9B948A">搜索、读文件的中间输出 · 用完即弃</text>

  <!-- ─── 特化 chips（钉在 harness 边界上） ─── -->
  <!-- 只读 system prompt -->
  <rect x="494" y="83" width="128" height="26" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
  <text class="zh" x="558" y="100" font-size="11.5" fill="#B85C39" text-anchor="middle">只读 system prompt</text>
  <!-- 工具白名单 -->
  <rect x="776" y="170" width="84" height="26" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
  <text class="zh" x="818" y="187" font-size="11.5" fill="#B85C39" text-anchor="middle">工具白名单</text>
  <text class="mono" x="844" y="226" font-size="12" fill="#9B948A">Edit</text>
  <line x1="841" y1="222" x2="876" y2="222" stroke="#D97757" stroke-width="1.3"/>
  <text class="mono" x="844" y="248" font-size="12" fill="#9B948A">Write</text>
  <line x1="841" y1="244" x2="884" y2="244" stroke="#D97757" stroke-width="1.3"/>
  <text class="mono" x="844" y="270" font-size="12" fill="#9B948A">Agent</text>
  <line x1="841" y1="266" x2="884" y2="266" stroke="#D97757" stroke-width="1.3"/>
  <!-- 默认模型 haiku -->
  <rect x="494" y="369" width="112" height="26" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
  <text class="zh" x="550" y="386" font-size="11.5" fill="#B85C39" text-anchor="middle">默认模型 haiku</text>
  <!-- omitClaudeMd -->
  <rect x="630" y="369" width="150" height="26" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
  <text class="mono" x="705" y="386" font-size="11" fill="#B85C39" text-anchor="middle">omitClaudeMd: true</text>

  <!-- ─── 图注 ─── -->
  <rect x="512" y="420" width="14" height="10" rx="3" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
  <text class="zh" x="534" y="429" font-size="12.5" fill="#6B655C">约束由 harness 层强制，不只写在 prompt 里</text>
</svg>
