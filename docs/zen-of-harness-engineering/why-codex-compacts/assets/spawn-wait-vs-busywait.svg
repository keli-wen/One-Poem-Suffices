<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2">
  <title id="t2">派出 explorer 后的两种主线程行为：上半是期望的分工，主线程等待、只做综合，探索的中间输出全部留在 explorer context；下半是 Codex 的实际行为，主线程一边等一边自己探索，探索输出同时进了主 context，隔离没起作用</title>
  <style>
    .zh  { font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .mono{ font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  </style>
  <defs>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#2B2722" opacity="0.045"/>
    </pattern>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B655C"/>
    </marker>
    <marker id="ah-coral2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="940" height="470" fill="#FFFFFF"/>
  <rect width="940" height="470" fill="url(#dots2)"/>

  <!-- ─── 上半：期望的分工 ─── -->
  <rect x="52" y="34" width="836" height="178" rx="16" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="72" y="64" font-size="15" font-weight="600" fill="#2B2722">期望：主线程等结果，探索都留在 explorer 里</text>
  <text class="mono" x="868" y="64" font-size="10.5" fill="#D97757" text-anchor="end">wait_agent</text>
  <line x1="72" y1="76" x2="868" y2="76" stroke="#EFE9E1" stroke-width="1"/>

  <!-- 主线程泳道 -->
  <text class="zh" x="72" y="106" font-size="11" fill="#9B948A">主线程</text>
  <text class="mono" x="168" y="100" font-size="11" fill="#2B2722" text-anchor="middle">spawn_agent</text>
  <circle cx="168" cy="116" r="3.5" fill="#2B2722"/>
  <line x1="182" y1="116" x2="700" y2="116" stroke="#D9D4CC" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
  <text class="zh" x="440" y="138" font-size="10.5" fill="#9B948A" text-anchor="middle">等待 · 不做探索，主 context 平走</text>
  <line x1="706" y1="116" x2="812" y2="116" stroke="#D97757" stroke-width="5" stroke-linecap="round"/>
  <text class="zh" x="759" y="100" font-size="11" fill="#B85C39" text-anchor="middle">综合</text>

  <!-- 派发 / 回收 -->
  <path d="M 172 122 C 176 138, 180 148, 188 156" fill="none" stroke="#6B655C" stroke-width="1.4" marker-end="url(#ah-ink2)"/>
  <path d="M 628 174 C 668 168, 686 140, 700 122" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#ah-coral2)"/>
  <text class="zh" x="712" y="146" font-size="11" fill="#2B2722">只回结论</text>

  <!-- explorer 泳道 -->
  <text class="zh" x="72" y="166" font-size="11" fill="#9B948A">explorer</text>
  <line x1="190" y1="158" x2="560" y2="158" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <line x1="190" y1="174" x2="620" y2="174" stroke="#D8D2C9" stroke-width="7" stroke-linecap="round"/>
  <line x1="190" y1="190" x2="584" y2="190" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <text class="zh" x="190" y="206" font-size="10.5" fill="#9B948A">中间输出留在 explorer context · 用完即弃</text>

  <!-- ─── 下半：实际行为 ─── -->
  <rect x="52" y="248" width="836" height="178" rx="16" fill="#FFFDFB" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="72" y="278" font-size="15" font-weight="600" fill="#2B2722">实际：主线程一边等，一边自己探索</text>
  <line x1="72" y1="290" x2="868" y2="290" stroke="#EFE9E1" stroke-width="1"/>

  <!-- 主线程泳道：等待期里自己也在读文件 -->
  <text class="zh" x="72" y="318" font-size="11" fill="#9B948A">主线程</text>
  <text class="mono" x="168" y="312" font-size="11" fill="#2B2722" text-anchor="middle">spawn_agent</text>
  <circle cx="168" cy="328" r="3.5" fill="#2B2722"/>
  <line x1="190" y1="322" x2="430" y2="322" stroke="#D8D2C9" stroke-width="7" stroke-linecap="round"/>
  <line x1="240" y1="336" x2="566" y2="336" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <line x1="578" y1="328" x2="744" y2="328" stroke="#D9D4CC" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
  <rect x="460" y="296" width="96" height="24" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
  <text class="zh" x="508" y="312" font-size="11" fill="#B85C39" text-anchor="middle">“轻量索引”</text>
  <rect x="564" y="296" width="96" height="24" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.2"/>
  <text class="zh" x="612" y="312" font-size="11" fill="#B85C39" text-anchor="middle">“避免空转”</text>
  <text class="zh" x="190" y="360" font-size="11" fill="#B85C39">探索输出也进了主 context，隔离没起作用</text>

  <!-- 派发 / 回收 -->
  <path d="M 172 334 C 176 352, 180 364, 188 376" fill="none" stroke="#6B655C" stroke-width="1.4" marker-end="url(#ah-ink2)"/>
  <path d="M 628 398 C 688 392, 726 352, 750 334" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#ah-coral2)"/>
  <text class="zh" x="758" y="356" font-size="11" fill="#2B2722">只回结论</text>

  <!-- explorer 泳道 -->
  <text class="zh" x="72" y="388" font-size="11" fill="#9B948A">explorer</text>
  <line x1="190" y1="382" x2="560" y2="382" stroke="#E4DFD8" stroke-width="7" stroke-linecap="round"/>
  <line x1="190" y1="398" x2="620" y2="398" stroke="#D8D2C9" stroke-width="7" stroke-linecap="round"/>

  <!-- ─── 图注 ─── -->
  <line x1="92" y1="447" x2="118" y2="447" stroke="#D8D2C9" stroke-width="7" stroke-linecap="round"/>
  <text class="zh" x="128" y="451" font-size="12.5" fill="#6B655C">粗线 = 搜索/读文件的中间输出</text>
  <line x1="420" y1="447" x2="446" y2="447" stroke="#D9D4CC" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
  <text class="zh" x="456" y="451" font-size="12.5" fill="#6B655C">虚线 = 等待，不产生输出</text>
</svg>
